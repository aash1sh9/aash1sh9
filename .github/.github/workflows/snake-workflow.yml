name: Generate Stats Cards

on:
  schedule:
    - cron: "0 6 * * *"    # runs daily at 6:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: 'username=aash1sh9&show_icons=true&theme=dark&bg_color=0d0d0d&title_color=F97316&icon_color=F97316&text_color=e8e8e8&hide_border=true'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: 'username=aash1sh9&layout=compact&theme=dark&bg_color=0d0d0d&title_color=F97316&text_color=e8e8e8&hide_border=true'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh stats cards"
          git push
